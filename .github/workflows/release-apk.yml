name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
          ./node_modules/.bin/cap sync android

      - name: Build Android APKs
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android assembleDebug

      - name: Rename APKs with release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-universal-debug.apk "release-apks/retro-mix-${TAG}-universal.apk"
          cp android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk "release-apks/retro-mix-${TAG}-arm64-v8a.apk"
          cp android/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk "release-apks/retro-mix-${TAG}-armeabi-v7a.apk"
          cp android/app/build/outputs/apk/debug/app-x86_64-debug.apk "release-apks/retro-mix-${TAG}-x86_64.apk"

      - name: Upload APKs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-apks/*.apk --clobber
          else
            gh release create "$TAG" release-apks/*.apk --title "Retro Mix ${TAG}" --generate-notes
          fi
